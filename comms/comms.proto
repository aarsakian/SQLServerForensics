syntax = "proto3";



option go_package = "mssqlparser.comms";

message FileDetails {
    string Mdffile = 1;
    string Ldffile = 2;
    bool Carve = 3;
    uint32 LdfLevel = 4;
}

message MTF {
    string MtfFile = 1;
}

enum ExportFormat {
    CSV = 0;
    XLSX = 1;
    HTML = 2;
}

message Col {
    string Name = 1;
    string Type = 2;
}

message Table {
    string Name = 1;
    string Type = 2;
    uint32 NofRows = 3;
    repeated Col Cols =4 ;
    ExportFormat Format = 5;
}

message TableResponse {
    oneof MessageType {
        Table Table = 1;
        Message Message =2; 
    }
}

message Rows {
    repeated Row row = 1;
}

message Database {
    string Name = 1;
    string ExportPath = 2;
    ExportFormat Format = 3;
}


message RowResponse {
    oneof MessageType {
        Row Row =1;
        Message Message=2;
    }
}
message Row {
    repeated string Vals = 1;
    bool Carved = 2;
    bool Logged = 3; 
    string LoggedOperation = 4;
}

message Page {
    string Type = 1;
    uint32 ID = 2;
}

message Tables {
    repeated Table Tables = 1;
}

message Message {
    string Content = 1;
}
message Config {
    string ExporPath = 1;
    bool Carve = 2;
}

service FileProcessorService {
    rpc SetConfig(Config) returns (Message){}
    rpc UpdateConfig(Config) returns (Message){}
    rpc Process(FileDetails) returns (stream TableResponse){}
    rpc ProcessBak(MTF) returns (stream TableResponse){}
    rpc ExportTable(Table) returns (Message){}
    rpc ExportDatabase(Database) returns (stream Message){}
    rpc GetTableContents(Table) returns (stream Row) {}
    rpc GetTableAllocationInfo(Table) returns (stream Page) {}
    rpc MessageStream(stream Message) returns(stream Message) {}
   
}

